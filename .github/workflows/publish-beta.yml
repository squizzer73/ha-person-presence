name: Publish approved 0.3.0b2 beta
on:
  push:
    branches: [main]
    paths: [.github/release-requests/0.3.0b2.json]
  workflow_dispatch:
permissions: {}
concurrency:
  group: publish-person-presence-0.3.0b2
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'squizzer73/ha-person-presence' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: squizzer73/ha-person-presence
      RELEASE_SHA: 4cbf35662ffc7e9759267de2a5d8788b5a2d77ef
      RELEASE_TAG: 0.3.0b2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4cbf35662ffc7e9759267de2a5d8788b5a2d77ef
          persist-credentials: false
      - name: Verify the approved commit passed all required checks
        shell: bash
        run: |
          gh run watch 42352040290 --exit-status --interval 10
          gh api repos/$GH_REPO/actions/runs/42352040290 > "$RUNNER_TEMP/approved-run.json"
          gh api repos/$GH_REPO/actions/runs/42352040290/jobs > "$RUNNER_TEMP/approved-jobs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root / 'approved-run.json').read_text())
          jobs = json.loads((root / 'approved-jobs.json').read_text())['jobs']
          assert run['head_sha'] == os.environ['RELEASE_SHA']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          required = {'tests', 'hassfest', 'marketplace'}
          assert {j['name'] for j in jobs} == required
          assert all(j['conclusion'] == 'success' for j in jobs)
          assert json.loads(Path('custom_components/person_presence/manifest.json').read_text())['version'] == os.environ['RELEASE_TAG']
          PY
      - name: Build and verify the approved install package
        run: |
          python3 scripts/build_release.py --output dist/beta
          cd dist/beta
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('person-presence-0.3.0b2.zip').read_bytes()).hexdigest() == 'f717f03e8eb19b6c0a4a4332b8d000d7fd7896d3d7f289ffe1280a76678bb1df'
          PY
      - name: Prepare public beta notes
        run: cp docs/releases/0.3.0b2.md "$RUNNER_TEMP/release-notes.md"
      - name: Create a draft with both assets, then publish as a prerelease
        run: |
          gh release create "$RELEASE_TAG" dist/beta/person-presence-0.3.0b2.zip dist/beta/SHA256SUMS --target "$RELEASE_SHA" --title "Person Presence 0.3.0b2 — public beta" --notes-file "$RUNNER_TEMP/release-notes.md" --draft --prerelease
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
