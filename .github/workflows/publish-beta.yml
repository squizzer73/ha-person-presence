name: Publish approved 0.2.0b1 beta
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: publish-person-presence-0.2.0b1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'squizzer73/ha-person-presence' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: squizzer73/ha-person-presence
      RELEASE_SHA: 80b07bd57d134b3a7de52696b793ad4dac780081
      RELEASE_TAG: 0.2.0b1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 80b07bd57d134b3a7de52696b793ad4dac780081
          persist-credentials: false
      - name: Verify the approved commit passed all required checks
        shell: bash
        run: |
          gh api repos/$GH_REPO/actions/runs/42197883378 > "$RUNNER_TEMP/approved-run.json"
          gh api repos/$GH_REPO/actions/runs/42197883378/jobs > "$RUNNER_TEMP/approved-jobs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root / 'approved-run.json').read_text())
          jobs = json.loads((root / 'approved-jobs.json').read_text())['jobs']
          assert run['head_sha'] == os.environ['RELEASE_SHA']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          required = {'tests', 'hassfest', 'marketplace'}
          assert {j['name'] for j in jobs} == required
          assert all(j['conclusion'] == 'success' for j in jobs)
          assert json.loads(Path('custom_components/person_presence/manifest.json').read_text())['version'] == os.environ['RELEASE_TAG']
          PY
      - name: Build and verify the approved install package
        run: |
          python3 scripts/build_release.py --output dist/beta
          cd dist/beta
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('person-presence-0.2.0b1.zip').read_bytes()).hexdigest() == 'c4b3ae31fcb8680332898bff496e76bdd054331d75ed292be51c4cb8c364d014'
          PY
      - name: Prepare public beta notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          First public beta of Person Presence for Home Assistant Core 2026.11 or later.

          - Combines existing phone, watch and room observations into a Whereabouts sensor: room, Home, zone, Away or Unknown.
          - Guided per-person setup, capability-filtered entity choices, device preference ordering and an unsaved decision preview.
          - Source health, Repairs, private integration diagnostics and optional last-known diagnostics.
          - Preserves existing configuration, entity identities and user enablement choices when upgrading.
          - MIT licensed; no telemetry, new cloud account or device-control commands.

          Validation: 71 tests, lint, formatting, type checks, deterministic packaging, hassfest and Marketplace validation passed for the exact tagged commit. No checks were ignored. Catalog inclusion is separate.

          This is a beta. Physical acceptance and provider coverage remain incomplete. Wearing is unconfirmed without an actual on-body source. Watch-only outdoor tracking needs fresh location observations from the carried watch's provider; this integration cannot manufacture them. Stale or conflicting evidence may correctly produce Unknown.

          Installation: extract the attached ZIP into your Home Assistant configuration directory so it contains custom_components/person_presence, then follow the README setup instructions. Back up before upgrading, restart HA after an update, and compare the result with real device movements. Review source mappings before using this beta in automations.

          SHA256SUMS applies to the attached install ZIP. GitHub's automatic source archives contain the full repository, not the install-only package.
          NOTES
      - name: Create a draft with both assets, then publish as a prerelease
        run: |
          gh release create "$RELEASE_TAG" dist/beta/person-presence-0.2.0b1.zip dist/beta/SHA256SUMS --target "$RELEASE_SHA" --title "Person Presence 0.2.0b1 — public beta" --notes-file "$RUNNER_TEMP/release-notes.md" --draft --prerelease
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
